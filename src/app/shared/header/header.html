<header class="header">
  <a class="brand" href="/">
    <span class="brand-name">{{ title() }}</span>
  </a>

  <div class="bar">
    <nav class="sections" aria-label="Sections">
      @for (section of sections; track section.path) {
        <a
          class="section"
          [routerLink]="section.path"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
        >
          <app-icon [name]="section.icon" />
          <span>{{ section.label }}</span>
        </a>
      }
    </nav>

    <nav class="actions">
      @let dark = theme.mode() === 'dark';
      <button
        type="button"
        class="action theme-toggle"
        [attr.aria-label]="dark ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="theme.toggle()"
      >
        <app-icon [name]="dark ? 'sun' : 'moon'" />
      </button>

      <button type="button" class="action">
        <span class="bell">
          <app-icon name="bell" />
          @if (hasUnreadNotifications()) {
            <span class="badge" aria-label="Unread notifications"></span>
          }
        </span>
        <span class="label">Notifications</span>
      </button>

      <button type="button" class="action" aria-haspopup="menu">
        <span class="avatar" aria-hidden="true">{{ userName().charAt(0) }}</span>
        <span class="label">{{ userName() }}</span>
        <app-icon name="chevron-down" class="chevron" />
      </button>
    </nav>
  </div>
</header>
