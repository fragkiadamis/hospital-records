<section class="page">
  <nav class="toolbar">
    <a class="back" [routerLink]="['/patients', id()]">
      <app-icon name="arrow-left" />
      Back to patient
    </a>
    @if (belongsToPatient()) {
      <div class="actions">
        <button
          type="button"
          class="button"
          [disabled]="editingReasons()"
          (click)="editingReasons.set(true)"
        >
          <app-icon name="stethoscope" />
          Edit reasons
        </button>
      </div>
    }
  </nav>

  @if (belongsToPatient() && study.hasValue()) {
    <app-study-reasons
      [study]="study.value()"
      [patientId]="id()"
      [(open)]="editingReasons"
      (changed)="study.reload()"
    />
  }

  <div aria-live="polite" [attr.aria-busy]="study.isLoading()">
    @if (study.error()) {
      <div class="alert" role="alert">
        <app-icon name="alert-triangle" />
        <span>{{ errorMessage() }}</span>
        <button type="button" class="button" (click)="study.reload()">Try again</button>
      </div>
    } @else if (study.hasValue()) {
      @if (belongsToPatient()) {
        <app-imaging-study-detail [study]="study.value()" [patientId]="id()" />
      } @else {
        <div class="alert" role="alert">
          <app-icon name="alert-triangle" />
          <span>This imaging study does not belong to this patient.</span>
        </div>
      }
    } @else {
      <div class="card"><p class="state">Loading imaging study…</p></div>
    }
  </div>
</section>
