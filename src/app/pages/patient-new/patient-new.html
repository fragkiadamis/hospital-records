<section class="page narrow">
  <nav class="toolbar">
    <a class="back" routerLink="/patients">
      <app-icon name="arrow-left" />
      Patients
    </a>
  </nav>

  <h1>New patient</h1>

  @if (error()) {
    <div class="alert" role="alert">
      <app-icon name="alert-triangle" />
      <span>The patient was not saved: {{ error() }}</span>
    </div>
  }

  <app-patient-form [saving]="saving()" (save)="create($event)" (cancelled)="cancel()" />
</section>
