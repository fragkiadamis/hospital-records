<section class="page">
  <nav class="toolbar">
    <a class="back" routerLink="/patients">
      <i class="ti ti-arrow-left" aria-hidden="true"></i>
      Patients
    </a>
    @if (patient.hasValue()) {
      <div class="actions">
        <a class="button" [routerLink]="['/patients', id(), 'edit']">
          <i class="ti ti-pencil" aria-hidden="true"></i>
          Edit
        </a>
        <button
          type="button"
          class="button danger"
          [disabled]="deleting()"
          (click)="deleting.set(true)"
        >
          <i class="ti ti-trash" aria-hidden="true"></i>
          Delete
        </button>
      </div>
    }
  </nav>

  @if (patient.hasValue()) {
    <app-delete-panel
      resourceType="Patient"
      noun="patient"
      [resourceId]="id()"
      [name]="name()"
      [(open)]="deleting"
      (deleted)="onDeleted()"
    />
  }

  <div aria-live="polite" [attr.aria-busy]="patient.isLoading()">
    @if (patient.error()) {
      <div class="alert" role="alert">
        <i class="ti ti-alert-triangle" aria-hidden="true"></i>
        <span>{{ errorMessage() }}</span>
        <button type="button" class="button" (click)="patient.reload()">Try again</button>
      </div>
    } @else if (patient.hasValue()) {
      <app-patient-detail [patient]="patient.value()" />
      <app-patient-conditions class="conditions" [patientId]="id()" />
    } @else {
      <div class="card"><p class="state">Loading patient…</p></div>
    }
  </div>
</section>
