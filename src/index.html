<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Artemis</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Apply the saved/OS theme before first paint to avoid a light flash; see shared/theme/theme.ts -->
    <script>
      try {
        const saved = localStorage.getItem('artemis-theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
