name: Lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm # reuses downloaded packages between runs

      - name: Install dependencies
        run: npm ci # exact versions from package-lock.json

      - name: Lint
        run: npm run lint