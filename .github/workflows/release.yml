name: Release

# Run by hand (Actions → Release → Run workflow) when a milestone is done. Everything merged
# since the last tag goes into one version bump and one CHANGELOG section.
on:
  workflow_dispatch:

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # push the release commit and tag
  issues: write # @semantic-release/github comments on released issues
  pull-requests: write # ...and on released PRs

jobs:
  release:
    name: Semantic release
    if: github.ref == 'refs/heads/main' # the Run workflow button lets you pick any branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24

      - name: Install semantic-release
        run: >
          npm install --no-save --no-package-lock
          semantic-release@25.0.9
          @semantic-release/changelog@7.0.0
          @semantic-release/git@11.0.1
          conventional-changelog-conventionalcommits@9.3.1

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
